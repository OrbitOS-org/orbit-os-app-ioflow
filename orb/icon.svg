<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" aria-hidden="true">
  <title>Peripherals</title>
  <defs>
    <linearGradient id="orbStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B8DEE"/>
      <stop offset="100%" stop-color="#7C5CF5"/>
    </linearGradient>
    <linearGradient id="orbFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8EB4FF"/>
      <stop offset="100%" stop-color="#5B8DEE"/>
    </linearGradient>
  </defs>
  <!-- Orbit / central hub -->
  <circle cx="64" cy="64" r="52" stroke="url(#orbStroke)" stroke-width="3" stroke-dasharray="10 8" stroke-linecap="round" opacity="0.85"/>
  <!-- Peripheral nodes on orbit -->
  <circle cx="64" cy="12" r="7" fill="url(#orbFill)" stroke="#4A6FC7" stroke-width="1.5"/>
  <circle cx="110" cy="88" r="7" fill="url(#orbFill)" stroke="#4A6FC7" stroke-width="1.5"/>
  <circle cx="18" cy="88" r="7" fill="url(#orbFill)" stroke="#4A6FC7" stroke-width="1.5"/>
  <!-- Keyboard (simplified) -->
  <rect x="34" y="52" width="60" height="34" rx="4" stroke="url(#orbStroke)" stroke-width="2.5"/>
  <line x1="42" y1="61" x2="86" y2="61" stroke="url(#orbStroke)" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  <line x1="42" y1="69" x2="74" y2="69" stroke="url(#orbStroke)" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  <line x1="42" y1="77" x2="78" y2="77" stroke="url(#orbStroke)" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  <!-- Mouse (arc) -->
  <path d="M 78 44 C 88 38 98 44 98 56 L 98 60" stroke="url(#orbStroke)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Cable / link to hub -->
  <path d="M 64 46 L 64 52" stroke="url(#orbStroke)" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
</svg>
