<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>{{.Title}} · Orbit OS</title>
    <link rel="icon" type="image/svg+xml" href="{{asset "favicon.svg"}}">
    <link rel="stylesheet" href="{{asset "css/style.css"}}">
    <script>try{var t=localStorage.getItem('ioflow-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
    {{block "content" .}}{{end}}
    <footer class="foot"><span>{{.Title}} v{{.Version}}</span><svg class="brand" viewBox="0 0 759.76 192" role="img" aria-label="Orbit OS"><use href="{{asset "orbit-os-logo.svg"}}#logo"/></svg></footer>
    <script src="{{asset "js/core.js"}}"></script>
    <script src="{{asset (printf "js/%s.js" .ScriptFile)}}"></script>
</body>
</html>
